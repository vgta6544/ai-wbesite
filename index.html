    <script>
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' ? window.fetch : null;
          var currentFetch = originalFetch ? originalFetch.bind(window) : null;

          function installShim(target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (desc && !desc.configurable) return;
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }

          if (typeof window !== 'undefined') {
            installShim(window);
          }
          if (typeof Window !== 'undefined' && Window.prototype) {
            installShim(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            installShim(globalThis);
          }
        } catch (err) {}
      })();
    </script>
